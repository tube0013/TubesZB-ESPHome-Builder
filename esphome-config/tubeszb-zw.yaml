esphome:
  name: tubeszb-zw
  project:
    name: tubezb.zw
    version: ${project_version}
  min_version: 2026.3.2

packages:
  version: !include ../common/version.yaml
  esp_idf: !include
    file: ../common/esp_idf.yaml
    vars:
      board: esp32-poe
  ethernet: !include
    file: ../common/ethernet_olimex_static.yaml
    vars:
      static_ip: STATIC_IP
      gateway: GATEWAY
      subnet: SUBNET
  base: !include ../common/base_static.yaml
  device_info: !include ../common/device_info.yaml
  web_server: !include ../common/web_server_zwave.yaml

external_components:
  - source: github://tube0013/esphome-components
    components: [stream_server]

script:
  - id: run_update_checks
    then:
      - logger.log: "Internet confirmed. No ESPHome self-update is configured for static IP builds."

button:
  - platform: restart
    name: "Restart the Device"
    icon: mdi:restart
    web_server:
      sorting_group_id: device_control_group
      sorting_weight: 10

  - platform: template
    name: "Pause Stream"
    id: pause_stream
    web_server:
      sorting_group_id: zwave_control_group
      sorting_weight: 10
    on_press:
      - stream_server.pause: { id: stream_srv }

  - platform: template
    name: "Resume Stream"
    id: resume_stream
    web_server:
      sorting_group_id: zwave_control_group
      sorting_weight: 20
    on_press:
      - stream_server.resume: { id: stream_srv }

uart:
  id: uart_bus
  rx_pin: GPIO16
  tx_pin: GPIO5
  baud_rate: 115200
  rx_buffer_size: 1024

stream_server:
  id: stream_srv
  buffer_size: 1024
  uart_id: uart_bus
  port: 6638

binary_sensor:
  - platform: stream_server
    stream_server: stream_srv
    connected:
      name: "Z-Wave Serial Connection Status"
      device_class: connectivity
      icon: mdi:serial-port
      web_server:
        sorting_group_id: zwave_info_group
        sorting_weight: 5

mdns:
  services:
    - service: "_zwave"
      protocol: "_tcp"
      port: 6638
      txt:
        version: 1
        name: "TubesZB"
        serial_number: !lambda 'return esphome::get_mac_address();'
