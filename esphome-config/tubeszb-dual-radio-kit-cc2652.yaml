esphome:
  name: tubeszb-dual-radio-kit-cc2652
  project:
    name: tubezb.cc2652+zw
    version: ${project_version}
  min_version: 2026.3.2
  on_boot:
    - priority: 600
      then:
        - switch.turn_on: zRST_gpio
        - delay: 15ms
        - switch.turn_off: zRST_gpio
    - priority: 550
      then:
        - lambda: |-
            const auto &saved = id(change_baud_rate).state;
            if (saved.empty()) {
              ESP_LOGD("apply_uart_baud", "No saved baud rate; skipping restore");
              return;
            }
            ESP_LOGD("apply_uart_baud", "Restoring baud rate from saved state: %s", saved.c_str());
        - script.execute:
            id: apply_uart_baud
            baud_str: !lambda 'return id(change_baud_rate).state;'

packages:
  version: !include ../common/version.yaml
  esp_idf: !include
    file: ../common/esp_idf.yaml
    vars:
      board: esp32-poe
  ethernet: !include
    file: ../common/ethernet_olimex_static.yaml
    vars:
      static_ip: STATIC_IP
      gateway: GATEWAY
      subnet: SUBNET
  base: !include ../common/base_static.yaml
  device_info: !include ../common/device_info.yaml
  web_server: !include ../common/web_server_zigbee.yaml
  zigbee_beta: !include
    file: ../common/zigbee_fw_beta_cc2652.yaml
    vars:
      zigbee_stable_manifest_url: "https://raw.githubusercontent.com/tube0013/tube_gateways/refs/heads/main/misc/manifest.json"
      zigbee_beta_manifest_url: "https://raw.githubusercontent.com/tube0013/tube_gateways/refs/heads/main/misc/manifest_beta.json"

external_components:
  - source: github://tube0013/esphome-components
    components: [stream_server, cc2652_flasher]

script:
  - id: run_update_checks
    then:
      - logger.log: "Internet confirmed. Triggering firmware checks."
      - if:
          condition:
            lambda: 'return id(zb_variant).state.empty() || id(zb_variant).state == "unknown";'
          then:
            - cc2652_flasher.detect_variant:
                id: zigbee_flasher
            - wait_until:
                condition:
                  lambda: 'return !id(zb_variant).state.empty() && id(zb_variant).state != "unknown";'
                timeout: 10s
      - cc2652_flasher.check_update: { id: zigbee_flasher }

  - id: fw_update_mode
    then:
      - switch.turn_on: zBSL
      - delay: 1s
      - switch.turn_on: zRST_gpio
      - delay: 1s
      - switch.turn_off: zRST_gpio
      - logger.log: "Delaying ~10 seconds for cc2652p2 to settle"
      - delay: 11s
      - switch.turn_off: zBSL
      - logger.log: "Please try update with cc2538-bsl tool now"
      - logger.log: "cc-bsl usage: cc2538-bsl.py -p socket://ip-of-gw:6638 -evw firmware.hex"

  - id: apply_uart_baud
    mode: queued
    parameters:
      baud_str: string
    then:
      - if:
          condition:
            lambda: 'return baud_str.empty();'
          then:
            - logger.log:
                format: "apply_uart_baud: empty baud_str; skipping"
                level: DEBUG
          else:
            - stream_server.pause: { id: zb }
            - delay: 50ms
            - lambda: |-
                auto *bus = id(uart_bus_zb);
                const uint32_t new_baud_rate = strtoul(baud_str.c_str(), nullptr, 10);
                const uint32_t current_baud = bus->get_baud_rate();
                ESP_LOGD("apply_uart_baud", "Changing baud rate from %u to %u", current_baud, new_baud_rate);
                id(zigbee_flasher).set_restore_baud(new_baud_rate);
                if (current_baud == new_baud_rate) {
                  ESP_LOGD("apply_uart_baud", "Requested baud already active; skipping reconfig");
                  return;
                }
                // Best-effort drain TX without blocking indefinitely (avoid WDT).
                #include "driver/uart.h"
                const uart_port_t uart_num = static_cast<uart_port_t>(bus->get_hw_serial_number());
                uart_wait_tx_done(uart_num, pdMS_TO_TICKS(50));
                uart_flush_input(uart_num);
                App.feed_wdt();
                bus->set_baud_rate(new_baud_rate);
                App.feed_wdt();
                bus->load_settings();
                App.feed_wdt();
            - delay: 50ms
            - stream_server.resume: { id: zb }

switch:
  - platform: gpio
    pin: 5
    id: zRST_gpio
    inverted: yes
    restore_mode: ALWAYS_OFF
    icon: mdi:toggle-switch-outline
    web_server:
      sorting_group_id: device_control_group
      sorting_weight: 50

  - platform: gpio
    pin: 16
    name: "Zigbee Module Bootloader Pin"
    id: zBSL
    inverted: yes
    restore_mode: ALWAYS_OFF
    icon: mdi:toggle-switch-outline
    disabled_by_default: true
    web_server:
      sorting_group_id: device_control_group
      sorting_weight: 60

select:
  - id: change_baud_rate
    name: Baud rate
    platform: template
    options:
      - "115200"
      - "230400"
      - "460800"
      - "921600"
    initial_option: "115200"
    optimistic: true
    restore_value: True
    internal: false
    entity_category: config
    icon: mdi:swap-horizontal
    web_server:
      sorting_group_id: zigbee_control_group
      sorting_weight: 5
    set_action:
      - script.execute:
          id: apply_uart_baud
          baud_str: !lambda 'return x;'

uart:
  - id: uart_bus_zb
    rx_pin: GPIO36
    tx_pin: GPIO4
    baud_rate: 115200
  - id: uart_bus_zw
    rx_pin: GPIO15
    tx_pin: GPIO14
    baud_rate: 115200

stream_server:
  - id: zb
    uart_id: uart_bus_zb
    port: 6638
  - id: zw
    uart_id: uart_bus_zw
    port: 6639

binary_sensor:
  - platform: stream_server
    stream_server: zb
    connected:
      name: "Zigbee Serial Connection Status"
      device_class: connectivity
      icon: mdi:serial-port
      web_server:
        sorting_group_id: zigbee_info_group
        sorting_weight: 5
  - platform: stream_server
    stream_server: zw
    connected:
      name: "Z-Wave Serial Connection Status"
      device_class: connectivity
      icon: mdi:serial-port
      web_server:
        sorting_group_id: info_group
        sorting_weight: 5

mdns:
  services:
    - service: "_zigbee-coordinator"
      protocol: "_tcp"
      port: 6638
      txt:
        version: 1
        name: "TubesZB"
        radio_type: "znp"
        serial_number: !lambda 'return esphome::get_mac_address();'
    - service: "_zwave"
      protocol: "_tcp"
      port: 6639
      txt:
        version: 1
        name: "TubesZB"
        serial_number: !lambda 'return esphome::get_mac_address();'

cc2652_flasher:
  id: zigbee_flasher
  uart_id: uart_bus_zb
  url: "https://raw.githubusercontent.com/tube0013/tube_gateways/refs/heads/main/misc/manifest.json"
  bsl_switch: zBSL
  rst_switch: zRST_gpio
  boot_baud_rate: 500000
  restore_baud_rate: 115200
  erase_mode: bank
  debug: false
  show_progress: true
  progress_step: 5
  fw_version_text: zb_fw_version
  ieee_text: zb_ieee
  latest_fw_version_text: zb_latest_fw
  variant_text: zb_variant
  check_on_boot: false
  check_interval_days: 0
  detect_on_boot: false
  detect_on_boot_delay_ms: 0

button:
  - platform: template
    name: "Flash CC2652"
    id: flash_cc2652
    icon: mdi:flash
    web_server:
      sorting_group_id: zigbee_control_group
      sorting_weight: 30
    on_press:
      - cc2652_flasher.update_firmware:
          id: zigbee_flasher

  - platform: template
    name: "Check CC2652 Update"
    id: check_cc2652_update
    icon: mdi:cloud-search
    web_server:
      sorting_group_id: zigbee_control_group
      sorting_weight: 20
    on_press:
      - cc2652_flasher.check_update:
          id: zigbee_flasher

  - platform: template
    name: "Detect CC2652 Variant"
    id: detect_cc2652_variant
    icon: mdi:magnify-scan
    web_server:
      sorting_group_id: zigbee_control_group
      sorting_weight: 10
    on_press:
      - cc2652_flasher.detect_variant:
          id: zigbee_flasher

  - platform: restart
    name: "Restart the Device"
    icon: mdi:restart
    web_server:
      sorting_group_id: device_control_group
      sorting_weight: 10

  - platform: template
    name: "Zigbee Module Reset"
    disabled_by_default: true
    id: zRST
    icon: mdi:restart-alert
    web_server:
      sorting_group_id: zigbee_control_group
      sorting_weight: 40
    on_press:
      - switch.turn_on: zRST_gpio
      - delay: 15ms
      - switch.turn_off: zRST_gpio

  - platform: template
    name: "Trigger Zigbee Module Bootloader"
    disabled_by_default: true
    icon: mdi:application-import
    web_server:
      sorting_group_id: zigbee_control_group
      sorting_weight: 50
    on_press:
      - script.execute: fw_update_mode

  - platform: template
    name: "Pause Stream"
    id: pause_stream
    web_server:
      sorting_group_id: zigbee_control_group
      sorting_weight: 60
    on_press:
      - stream_server.pause: { id: zb }

  - platform: template
    name: "Resume Stream"
    id: resume_stream
    web_server:
      sorting_group_id: zigbee_control_group
      sorting_weight: 70
    on_press:
      - stream_server.resume: { id: zb }

text_sensor:
  - platform: template
    name: "Zigbee FW Version"
    id: zb_fw_version
    icon: mdi:chip
    web_server:
      sorting_group_id: zigbee_info_group
      sorting_weight: 10
  - platform: template
    name: "Zigbee IEEE"
    id: zb_ieee
    icon: mdi:identifier
    web_server:
      sorting_group_id: zigbee_info_group
      sorting_weight: 20
  - platform: template
    name: "Zigbee Latest FW"
    id: zb_latest_fw
    icon: mdi:update
    web_server:
      sorting_group_id: zigbee_info_group
      sorting_weight: 30
  - platform: template
    name: "Zigbee Variant"
    id: zb_variant
    icon: mdi:chip
    web_server:
      sorting_group_id: zigbee_info_group
      sorting_weight: 40
