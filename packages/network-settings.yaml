# Included by every hardware manifest. Paths are relative to the main YAML file.
external_components:
  - source:
      type: local
      path: ../components
    components: [network_settings]

network_settings:
  id: device_network_settings
  ethernet_id: ethernet0
  firmware_update_id: esphome_fw_updater

# State is restored synchronously from NVS by network_settings before Ethernet.
# DISABLED avoids an earlier template-switch setup overwriting that saved value.
switch:
  - platform: template
    id: use_without_internet
    name: "Use without internet"
    entity_category: config
    icon: mdi:cloud-off-outline
    restore_mode: DISABLED
    lambda: 'return id(device_network_settings).use_without_internet();'
    turn_on_action:
      - lambda: |-
          if (id(device_network_settings).set_use_without_internet(true))
            id(has_internet) = false;
    turn_off_action:
      - lambda: 'id(device_network_settings).set_use_without_internet(false);'
