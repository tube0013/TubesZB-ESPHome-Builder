# Branded frontend on the main address; the original interface remains at /esphome.
external_components:
  - source: github://tube0013/esphome-components@${tubeszb_components_ref}
    components: [tubeszb_web]
    refresh: 2min

tubeszb_web:
  network_settings_id: device_network_settings
  ethernet_id: ethernet0
  uart_id: uart_bus
  firmware_update_id: esphome_fw_updater
