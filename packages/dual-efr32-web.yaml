external_components:
  - source:
      type: local
      path: ../components
    components: [tubeszb_web]

tubeszb_web:
  id: tubeszb_frontend
  network_settings_id: device_network_settings
  ethernet_id: ethernet0
  uart_id: uart_bus_zb
  firmware_update_id: esphome_fw_updater
  zwave_uart_id: uart_bus_zw
  model: "TubesZB Dual Radio MGM24 + Z-Wave"
  zigbee:
    bootloader_script: fw_update_mode
    bootloader_button: trigger_efr32_bootloader
    stream_server_id: zb
    busy_sensor: ncp_busy
    firmware_sensor: ezsp_firmware
    latest_sensor: zb_latest_fw
    board_sensor: board_name
    manufacturer_sensor: mfg_string
    ieee_sensor: ezsp_ieee
    status_sensor: ezsp_info_status
    check_button: check_efr32_update
    flash_button: flash_efr32
    probe_button: ezsp_replay_identity
    reset_button: zRST
    pause_button: pause_serial_server
    resume_button: resume_serial_server
    baud_select: change_baud_rate
    custom_url_text: efr32_custom_fw_url
    gateway_beta_switch: beta_channel_switch
    zigbee_beta_switch: zigbee_fw_beta_switch
