# Existing MGM210 serial controls; radio identity/flashing additions await assessment.
external_components:
  - source:
      type: local
      path: ../components
    components: [tubeszb_web]

tubeszb_web:
  id: tubeszb_frontend
  network_settings_id: device_network_settings
  ethernet_id: ethernet0
  uart_id: uart_bus
  firmware_update_id: esphome_fw_updater
  serial_radio:
    radio_model: MGM210
    stream_server_id: stream_srv
    reset_button: zRST
    pause_button: pause_stream
    resume_button: resume_stream
    baud_select: change_baud_rate
