name: Validate network settings

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install esphome==2026.10.1 pytest
      - name: Test validation and network trial transactions
        run: python -m pytest -q tests/test_network_settings.py tests/test_tubeszb_web_assets.py tests/test_internet_policy.py tests/test_dual_radio_configs.py tests/test_frontend_rollout.py tests/test_manifest_baud.py tests/test_older_efr32_flashing.py tests/test_ezsp_bootloader.py
      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/tzb-browser-tests playwright@1.62.1
          /tmp/tzb-browser-tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Check browser interaction and mobile layout
        env:
          NODE_PATH: /tmp/tzb-browser-tests/node_modules
        run: node tests/network_ui_test.cjs
      - name: Check the branded Z-Wave frontend and log downloads
        env:
          NODE_PATH: /tmp/tzb-browser-tests/node_modules
        run: node tests/tubeszb_web_ui_test.cjs
      - name: Check shared log dropdown and persistent capture across sections
        env:
          NODE_PATH: /tmp/tzb-browser-tests/node_modules
        run: node tests/log_panel_ui_test.cjs
      - name: Check persistent internet-use controls and firmware guards
        env:
          NODE_PATH: /tmp/tzb-browser-tests/node_modules
        run: node tests/internet_mode_ui_test.cjs
      - name: Check all older Silicon Labs frontend profiles
        env:
          NODE_PATH: /tmp/tzb-browser-tests/node_modules
        run: node tests/older_silabs_ui_test.cjs
      - name: Check MGM24 radio controls and independent beta channels
        env:
          NODE_PATH: /tmp/tzb-browser-tests/node_modules
        run: node tests/mgm24_web_ui_test.cjs
      - name: Check combined Zigbee and Z-Wave pages and independent radio states
        env:
          NODE_PATH: /tmp/tzb-browser-tests/node_modules
        run: node tests/dual_radio_ui_test.cjs
      - name: Check CC2652 controls and native progress events
        env:
          NODE_PATH: /tmp/tzb-browser-tests/node_modules
        run: node tests/cc2652_web_ui_test.cjs
      - name: Check the actual legacy ESPHome bundle and event compatibility
        env:
          NODE_PATH: /tmp/tzb-browser-tests/node_modules
        run: node tests/legacy_web_ui_test.cjs
      - name: Validate all hardware manifests and compatibility entries
        run: python tests/check_configs.py
      - name: Compile representative Z-Wave firmware
        run: esphome compile manifests/tubeszb-2026-zw.yaml
      - name: Compile representative Zigbee firmware
        run: esphome compile manifests/tubeszb-cc2652p7-poe-2023.yaml
      - name: Compile MGM24 firmware with radio flashing and beta channels
        run: esphome compile manifests/tubeszb-efr32-mgm24-2023.yaml
      - name: Compile CC2652P2 PoE 2021 frontend
        run: esphome compile manifests/tubeszb-cc2652p2-poe-2021.yaml
      - name: Compile dual-radio CC2652 flash script
        run: esphome compile manifests/tubeszb-dual-radio-kit-cc2652.yaml
      - name: Compile dual-radio MGM24 frontend
        run: esphome compile manifests/tubeszb-dual-radio-kit-mgm24.yaml
      - name: Compile dual-radio MGM21 frontend
        run: esphome compile manifests/tubeszb-dual-radio-mgm21-2022.yaml
      - name: Compile MGM210 PoE 2022 frontend
        run: esphome compile manifests/tubeszb-efr32-mgm210-poe-2022.yaml
      - name: Compile MGM210 PoE 2023 frontend
        run: esphome compile manifests/tubeszb-efr32-mgm210-poe-2023.yaml
      - name: Compile retired MGM12 Pro1 frontend
        run: esphome compile manifests/tubeszb-efr32-mgm12-pro1.yaml
      - name: Compile retired MGM210 Series 2 frontend
        run: esphome compile manifests/tubeszb-efr32-mgm210-series-2.yaml
      - name: Check manifest baud parsing against the compiled ArduinoJson dependency
        run: python -m pytest -q tests/test_manifest_baud.py tests/test_older_efr32_flashing.py tests/test_ezsp_bootloader.py
