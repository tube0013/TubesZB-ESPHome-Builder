name: Build ESPHome Firmware

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      manifest_glob:
        description: 'Manifest glob for selective builds'
        required: false
  # Triggers the workflow when a new release is published
  release:
    types:
      - published

jobs:
  # This job finds all your device .yaml files in the 'manifests' directory
  list-manifests:
    name: List firmware manifests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          echo "matrix=$(find manifests -type f -name "${{ inputs.manifest_glob || '*' }}.yaml" -print | sort | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT

  # This job builds the firmware for each device found in the previous job
  build-firmwares:
    name: Firmware builder
    runs-on: ubuntu-latest
    # Using the official ESPHome container for consistency
    container:
      image: ghcr.io/esphome/esphome
    needs: [list-manifests]
    strategy:
      matrix:
        manifest: ${{ fromJson(needs.list-manifests.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile ESPHome Firmware
        id: compile-firmware
        run: |
          esphome compile ${{ matrix.manifest }}

          device_name=$(basename ${{ matrix.manifest }} .yaml)

          # Extract version from the YAML project block
          version=$(python3 -c "import yaml; data=yaml.safe_load(open('${{ matrix.manifest }}')); print(data['esphome']['project']['version'])")

          mv "manifests/.esphome/build/$device_name/.pioenvs/$device_name/firmware.factory.bin" "${device_name}_${version}.factory.bin"
          mv "manifests/.esphome/build/$device_name/.pioenvs/$device_name/firmware.ota.bin" "${device_name}_${version}.ota.bin"

          echo "device_name=$device_name" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-build-${{ steps.compile-firmware.outputs.device_name }}
          path: |
            ${{ steps.compile-firmware.outputs.device_name }}_${{ steps.compile-firmware.outputs.version }}.factory.bin
            ${{ steps.compile-firmware.outputs.device_name }}_${{ steps.compile-firmware.outputs.version }}.ota.bin
          if-no-files-found: error

  # This job handles releasing the assets and generating the OTA manifests
  release-assets:
    name: Upload release assets and OTA Manifests
    needs: [build-firmwares]
    # This job only runs when the workflow is triggered by a release event
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      # Required to write to the release assets
      contents: write
    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: firmware-build-*

      - name: Upload firmware binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.bin

      # -----------------------------------------------------------------------
      # STABLE RELEASE path  (prerelease == false)
      # -----------------------------------------------------------------------

      - name: Checkout gh-pages branch into a subdirectory (stable)
        if: ${{ !github.event.release.prerelease }}
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy Assets to Latest_Release folder in gh-pages checkout
        if: ${{ !github.event.release.prerelease }}
        run: |
          rm -rf gh-pages/latest-release
          mkdir -p gh-pages/Latest_Release
          cp artifacts/*.bin gh-pages/Latest_Release/

      - name: Generate directory listing for Latest_Release
        if: ${{ !github.event.release.prerelease }}
        uses: jayanta525/github-pages-directory-listing@624ac8c4e56893256d3772f61a88e3b14d54314e # v4.0.0
        with:
          FOLDER: gh-pages/Latest_Release

      - name: Generate OTA Manifests (stable)
        id: generate-manifests
        if: ${{ !github.event.release.prerelease }}
        run: |
          mkdir -p gh-pages/ota_manifests

          REPO_OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)

          for ota_file in artifacts/*.ota.bin; do
            versioned_name=$(basename "$ota_file" .ota.bin)
            device_name="${versioned_name%_*}"

            echo "Generating manifest for $device_name (${versioned_name})..."

            md5_checksum=$(md5sum "$ota_file" | cut -d' ' -f1)

            ota_url="https://${REPO_OWNER}.github.io/${REPO_NAME}/Latest_Release/${versioned_name}.ota.bin"

            jq -n \
              --arg name "$device_name" \
              --arg version "${{ github.event.release.tag_name }}" \
              --arg chipFamily "ESP32" \
              --arg path "$ota_url" \
              --arg md5 "$md5_checksum" \
              --arg release_url "${{ github.event.release.html_url }}" \
              --arg summary "${{ github.event.release.body }}" \
              '{
                "name": $name,
                "version": $version,
                "builds": [
                  {
                    "chipFamily": $chipFamily,
                    "parts": [{"path": $path, "offset": 0}],
                    "ota": {
                      "path": $path,
                      "md5": $md5,
                      "release_url": $release_url,
                      "summary": $summary
                    }
                  }
                ]
              }' > "gh-pages/ota_manifests/ota-${device_name}.json"

            echo "Manifest for $device_name created."
          done

      - name: Commit and Push Changes to gh-pages (stable)
        if: ${{ !github.event.release.prerelease }}
        run: |
          cd gh-pages
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A Latest_Release/ ota_manifests/
          git add -A latest-release/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Update stable release binaries and OTA manifests for ${{ github.event.release.tag_name }}"
            git push
          else
            echo "No changes to commit in gh-pages."
          fi

      # -----------------------------------------------------------------------
      # PRERELEASE / BETA path  (prerelease == true)
      # -----------------------------------------------------------------------

      - name: Checkout gh-pages branch into a subdirectory (beta)
        if: ${{ github.event.release.prerelease }}
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy Assets to Beta_Release folder in gh-pages checkout
        if: ${{ github.event.release.prerelease }}
        run: |
          rm -rf gh-pages/Beta_Release
          mkdir -p gh-pages/Beta_Release
          cp artifacts/*.bin gh-pages/Beta_Release/

      - name: Generate directory listing for Beta_Release
        if: ${{ github.event.release.prerelease }}
        uses: jayanta525/github-pages-directory-listing@624ac8c4e56893256d3772f61a88e3b14d54314e # v4.0.0
        with:
          FOLDER: gh-pages/Beta_Release

      - name: Generate OTA Manifests (beta)
        id: generate-beta-manifests
        if: ${{ github.event.release.prerelease }}
        run: |
          mkdir -p gh-pages/beta_ota_manifests

          REPO_OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)

          for ota_file in artifacts/*.ota.bin; do
            versioned_name=$(basename "$ota_file" .ota.bin)
            device_name="${versioned_name%_*}"

            echo "Generating beta manifest for $device_name (${versioned_name})..."

            md5_checksum=$(md5sum "$ota_file" | cut -d' ' -f1)

            ota_url="https://${REPO_OWNER}.github.io/${REPO_NAME}/Beta_Release/${versioned_name}.ota.bin"

            jq -n \
              --arg name "$device_name" \
              --arg version "${{ github.event.release.tag_name }}" \
              --arg chipFamily "ESP32" \
              --arg path "$ota_url" \
              --arg md5 "$md5_checksum" \
              --arg release_url "${{ github.event.release.html_url }}" \
              --arg summary "${{ github.event.release.body }}" \
              '{
                "name": $name,
                "version": $version,
                "builds": [
                  {
                    "chipFamily": $chipFamily,
                    "parts": [{"path": $path, "offset": 0}],
                    "ota": {
                      "path": $path,
                      "md5": $md5,
                      "release_url": $release_url,
                      "summary": $summary
                    }
                  }
                ]
              }' > "gh-pages/beta_ota_manifests/ota-${device_name}.json"

            echo "Beta manifest for $device_name created."
          done

      - name: Commit and Push Changes to gh-pages (beta)
        if: ${{ github.event.release.prerelease }}
        run: |
          cd gh-pages
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A Beta_Release/ beta_ota_manifests/
          if ! git diff --staged --quiet; then
            git commit -m "Update beta release binaries and OTA manifests for ${{ github.event.release.tag_name }}"
            git push
          else
            echo "No changes to commit in gh-pages."
          fi
