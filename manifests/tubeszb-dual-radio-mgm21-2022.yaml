esphome:
  name: tubeszb-dual-radio-mgm21-2022
  project:
    name: tubezb.mgm21+zw
    version: ${project_version}
  min_version: 2026.3.2
  on_boot:
    - priority: 600
      then:
        - switch.turn_on: zRST_gpio
        - delay: 15ms
        - switch.turn_off: zRST_gpio
    - priority: 550
      then:
        - lambda: |-
            const auto &saved = id(change_baud_rate).state;
            if (saved.empty()) {
              ESP_LOGD("apply_uart_baud", "No saved baud rate; skipping restore");
              return;
            }
            ESP_LOGD("apply_uart_baud", "Restoring baud rate from saved state: %s", saved.c_str());
        - script.execute:
            id: apply_uart_baud
            baud_str: !lambda 'return id(change_baud_rate).state;'

packages:
  version: !include ../common/version.yaml
  esp_idf: !include
    file: ../common/esp_idf.yaml
    vars:
      board: esp32-poe
  ethernet: !include ../common/ethernet_olimex.yaml
  base: !include ../common/base.yaml
  device_info: !include ../common/device_info.yaml
  web_server: !include ../common/web_server_zigbee.yaml
  fw_update: !include
    file: ../common/fw_update.yaml
    vars:
      stable_url: "https://tube0013.github.io/TubesZB-ESPHome-Builder/ota_manifests/ota-tubeszb-dual-radio-mgm21-2022.json"
      beta_url: "https://tube0013.github.io/TubesZB-ESPHome-Builder/beta_ota_manifests/ota-tubeszb-dual-radio-mgm21-2022.json"

external_components:
  - source: github://tube0013/esphome-components
    components: [stream_server]

script:
  - id: run_update_checks
    then:
      - logger.log: "Internet confirmed. Triggering firmware checks."
      - update.check: esphome_fw_updater

  - id: apply_uart_baud
    mode: queued
    parameters:
      baud_str: string
    then:
      - if:
          condition:
            lambda: 'return baud_str.empty();'
          then:
            - logger.log:
                format: "apply_uart_baud: empty baud_str; skipping"
                level: DEBUG
          else:
            - stream_server.pause: { id: zb }
            - delay: 50ms
            - lambda: |-
                auto *bus = id(uart_bus_zb);
                const uint32_t new_baud_rate = strtoul(baud_str.c_str(), nullptr, 10);
                const uint32_t current_baud = bus->get_baud_rate();
                ESP_LOGD("apply_uart_baud", "Changing baud rate from %u to %u", current_baud, new_baud_rate);
                if (current_baud == new_baud_rate) {
                  ESP_LOGD("apply_uart_baud", "Requested baud already active; skipping reconfig");
                  return;
                }
                // Best-effort drain TX without blocking indefinitely (avoid WDT).
                #include "driver/uart.h"
                const uart_port_t uart_num = static_cast<uart_port_t>(bus->get_hw_serial_number());
                uart_wait_tx_done(uart_num, pdMS_TO_TICKS(50));
                uart_flush_input(uart_num);
                App.feed_wdt();
                bus->set_baud_rate(new_baud_rate);
                App.feed_wdt();
                bus->load_settings();
                App.feed_wdt();
            - delay: 50ms
            - stream_server.resume: { id: zb }

interval:
  - interval: 7d
    startup_delay: 7d
    then:
      - script.execute: check_connectivity
      - delay: 5s
      - if:
          condition:
            lambda: 'return id(has_internet);'
          then:
            - update.check: esphome_fw_updater
          else:
            - logger.log: "Skipping update checks: No Internet."

switch:
  - platform: gpio
    pin: 2
    id: zRST_gpio
    inverted: yes
    restore_mode: ALWAYS_OFF
    icon: mdi:toggle-switch-outline
    web_server:
      sorting_group_id: device_control_group
      sorting_weight: 50

select:
  - id: change_baud_rate
    name: Baud rate
    platform: template
    options:
      - "115200"
      - "230400"
      - "460800"
      - "921600"
    initial_option: "115200"
    optimistic: true
    restore_value: True
    internal: false
    entity_category: config
    icon: mdi:swap-horizontal
    web_server:
      sorting_group_id: zigbee_control_group
      sorting_weight: 5
    set_action:
      - script.execute:
          id: apply_uart_baud
          baud_str: !lambda 'return x;'

uart:
  - id: uart_bus_zb
    rx_pin: GPIO5
    tx_pin: GPIO16
    baud_rate: 115200
    rx_buffer_size: 1024
  - id: uart_bus_zw
    rx_pin: GPIO15
    tx_pin: GPIO14
    baud_rate: 115200

stream_server:
  - id: zb
    uart_id: uart_bus_zb
    port: 6638
    buffer_size: 1024
  - id: zw
    uart_id: uart_bus_zw
    port: 6639

binary_sensor:
  - platform: stream_server
    stream_server: zb
    connected:
      name: "Zigbee Serial Connection Status"
      device_class: connectivity
      icon: mdi:serial-port
      web_server:
        sorting_group_id: zigbee_info_group
        sorting_weight: 5

  - platform: stream_server
    stream_server: zw
    connected:
      name: "Z-Wave Serial Connection Status"
      device_class: connectivity
      icon: mdi:serial-port
      web_server:
        sorting_group_id: info_group
        sorting_weight: 5

  - platform: gpio
    pin: 36
    name: "Bootloader pin (PA0)"
    id: zBSL
    disabled_by_default: true
    web_server:
      sorting_group_id: zigbee_control_group
      sorting_weight: 60

mdns:
  services:
    - service: "_zigbee-coordinator"
      protocol: "_tcp"
      port: 6638
      txt:
        version: 1
        name: "TubesZB"
        radio_type: "ezsp"
        serial_number: !lambda 'return esphome::get_mac_address();'
    - service: "_zwave"
      protocol: "_tcp"
      port: 6639
      txt:
        version: 1
        name: "TubesZB"
        serial_number: !lambda 'return esphome::get_mac_address();'

button:
  - platform: restart
    name: "Restart the Device"
    icon: mdi:restart
    web_server:
      sorting_group_id: device_control_group
      sorting_weight: 10

  - platform: template
    name: "EFR32 Reset"
    id: zRST
    disabled_by_default: true
    icon: mdi:restart-alert
    web_server:
      sorting_group_id: zigbee_control_group
      sorting_weight: 40
    on_press:
      - switch.turn_on: zRST_gpio
      - delay: 15ms
      - switch.turn_off: zRST_gpio

  - platform: template
    name: "Pause Stream"
    id: pause_stream
    web_server:
      sorting_group_id: zigbee_control_group
      sorting_weight: 60
    on_press:
      - stream_server.pause: { id: zb }

  - platform: template
    name: "Resume Stream"
    id: resume_stream
    web_server:
      sorting_group_id: zigbee_control_group
      sorting_weight: 70
    on_press:
      - stream_server.resume: { id: zb }
