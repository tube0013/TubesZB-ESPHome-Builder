esphome:
  name: tubeszb-2026-zw-experimental
  project:
    name: tubezb.zw2026exp
    version: ${project_version}
  min_version: 2026.3.2

packages:
  version: !include ../common/version.yaml
  esp_idf: !include
    file: ../common/esp_idf.yaml
    vars:
      board: esp32-poe
  ethernet: !include ../common/ethernet_olimex.yaml
  base: !include ../common/base.yaml
  device_info: !include ../common/device_info.yaml
  web_server: !include ../common/web_server_simple.yaml
  fw_update: !include
    file: ../common/fw_update.yaml
    vars:
      stable_url: "https://tube0013.github.io/TubesZB-ESPHome-Builder/ota_manifests/ota-tubeszb-2026-zw-experimental.json"
      beta_url: "https://tube0013.github.io/TubesZB-ESPHome-Builder/beta_ota_manifests/ota-tubeszb-2026-zw-experimental.json"

script:
  - id: run_update_checks
    then:
      - logger.log: "Internet confirmed. Triggering firmware checks."
      - update.check: esphome_fw_updater

interval:
  - interval: 7d
    startup_delay: 7d
    then:
      - script.execute: check_connectivity
      - delay: 5s
      - if:
          condition:
            lambda: 'return id(has_internet);'
          then:
            - update.check: esphome_fw_updater
          else:
            - logger.log: "Skipping update checks: No Internet."

uart:
  id: uart_bus
  rx_pin: GPIO15
  tx_pin: GPIO14
  baud_rate: 115200
  rx_buffer_size: 1024

zwave_proxy:
  uart_id: uart_bus

mdns:
  services:
    - service: "_zwave"
      protocol: "_esphome"
      txt:
        version: 1
        name: "TubesZB"
        serial_number: !lambda 'return esphome::get_mac_address();'

button:
  - platform: restart
    name: "Restart the Device"
    icon: mdi:restart
    web_server:
      sorting_group_id: device_control_group
      sorting_weight: 10
