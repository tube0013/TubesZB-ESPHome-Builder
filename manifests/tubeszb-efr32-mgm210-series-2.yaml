substitutions:
  older_efr32_stream: ss
  older_efr32_profile: tubeszb-efr32-mgm210-series-2
  older_efr32_manifest: https://tube0013.github.io/tube_gateways/firmware/efr32manifest_mgm210.json

# Hardware source: tube_gateways/models/retired/tubeszb-efr32-MGM210_Series_2/firmware/esphome/tubeszb-efr32-mgm210-series-2.yaml
# ESP-IDF migration build; validate OTA/partition compatibility on hardware before release.
packages:
  network_settings: !include ../packages/network-settings.yaml
  zigbee_web: !include ../packages/older-efr32-radio.yaml

esphome:
  name: tubeszb-efr32-mgm210-series-2
  project:
    name: tubeszb.efr32_mgm210_series_2
    version: "2026.10.25.1"
  min_version: 2026.10.1
  on_boot:
    - priority: 350
      then:
        - if:
            condition:
              switch.is_on: beta_channel_switch
            then:
              - lambda: 'id(esphome_fw_updater).set_source_url("https://tube0013.github.io/TubesZB-ESPHome-Builder/beta_ota_manifests/ota-${older_efr32_profile}.json");'

esp32:
  board: esp-wrover-kit
  framework:
    type: esp-idf
    advanced:
      include_builtin_idf_components:
        - esp_http_client
        - esp_crt_bundle
    sdkconfig_options:
      CONFIG_LWIP_MAX_SOCKETS: "16"
      CONFIG_PM_ENABLE: "n"
      # Prevent IDF from trying to power-down UART in light sleep, which causes
      # uart_param_config to return ESP_ERR_NOT_SUPPORTED on some targets
      CONFIG_PM_POWER_DOWN_PERIPHERAL_IN_LIGHT_SLEEP: "n"
      CONFIG_UART_ISR_IN_IRAM: "y"

external_components:
  - source: github://tube0013/esphome-components@${tubeszb_components_ref}
    components: [stream_server]
    refresh: 2min

# WT32-ETH01 Ethernet: preserved from the archived hardware configuration.
ethernet:
  id: ethernet0
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_EXT_IN
  phy_addr: 1
  power_pin: GPIO16
  on_connect:
    then:
      - script.execute: on_ethernet_connect


# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  reboot_timeout: 0s

ota:
  - platform: esphome
  - platform: web_server
  - platform: http_request

http_request:

update:
  - platform: http_request
    id: esphome_fw_updater
    name: TubesZB Firmware Update
    source: https://tube0013.github.io/TubesZB-ESPHome-Builder/ota_manifests/ota-tubeszb-efr32-mgm210-series-2.json
    update_interval: never

interval:
  - interval: 7d
    startup_delay: 7d
    then:
      # The connectivity result triggers update checks once, after the probe finishes.
      - script.execute: check_connectivity

web_server:
  port: 80
  version: 3
  js_url: ""
  js_include: ../www3TZB.js
  sorting_groups:
    - id: zigbee_info_group
      name: "Zigbee Information"
      sorting_weight: 10
    - id: info_group
      name: "Device Information"
      sorting_weight: 20
    - id: zigbee_control_group
      name: "Zigbee Controls"
      sorting_weight: 30
    - id: device_control_group
      name: "Device Controls"
      sorting_weight: 40

globals:
  - id: has_internet
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  - id: on_ethernet_connect
    mode: single
    then:
      - logger.log: "Ethernet Link Detected. Waiting for IP assignment..."
      - wait_until:
          condition:
            lambda: |-
              auto addresses = id(ethernet0).get_ip_addresses();
              return !addresses.empty() && addresses[0].is_set();
          timeout: 30s
      - logger.log: "IP Assigned. Starting connectivity check..."
      - script.execute: check_connectivity

  - id: check_connectivity
    then:
      - if:
          condition:
            lambda: 'return !id(device_network_settings).internet_allowed();'
          then:
            - lambda: 'id(has_internet) = false;'
            - logger.log: "Skipping online checks: Use without internet is enabled."
            - script.stop: check_connectivity
      - if:
          condition:
            lambda: 'return id(ethernet0).is_connected();'
          then:
            - http_request.get:
                url: https://www.google.com/generate_204
                on_response:
                  then:
                    - lambda: 'id(has_internet) = id(device_network_settings).internet_allowed() && (response->status_code == 204);'
                    - if:
                        condition:
                          lambda: 'return id(device_network_settings).internet_allowed() && id(has_internet);'
                        then:
                          - script.execute: run_update_checks
          else:
            - logger.log: "Ethernet not ready yet. Skipping connectivity check."

  - id: run_update_checks
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(device_network_settings).internet_allowed();'
          then:
            - lambda: 'id(has_internet) = false;'
            - logger.log: "Skipping online checks: Use without internet is enabled."
            - script.stop: run_update_checks
      - logger.log: "Internet confirmed. Triggering firmware checks."
      - if:
          condition:
            lambda: 'return id(device_network_settings).internet_allowed();'
          then:
            - lambda: 'id(tubeszb_frontend).check_gateway_update();'

          else:
            - logger.log: "Skipped firmware request: Use without internet is enabled."

      - if:
          condition:
            lambda: 'return id(device_network_settings).internet_allowed() && !id(device_network_settings).is_trial_active();'
          then:
            - button.press: check_efr32_update

switch:
  - platform: gpio
    pin: 33
    id: zRST_gpio
    inverted: yes
    restore_mode: ALWAYS_OFF
    icon: mdi:toggle-switch-outline
    web_server:
      sorting_group_id: device_control_group
      sorting_weight: 50

  - platform: gpio
    pin: 32
    name: "Pull Bootloader pin (PA2) to Low"
    id: zBSL
    inverted: yes
    restore_mode: ALWAYS_OFF
    disabled_by_default: true
    web_server:
      sorting_group_id: zigbee_control_group
      sorting_weight: 60

button:
  - platform: restart
    name: "Restart the Gateway"
    disabled_by_default: true
    web_server:
      sorting_group_id: device_control_group
      sorting_weight: 10

  - platform: template
    name: "EFR32 Reset"
    id: zRST
    disabled_by_default: true
    web_server:
      sorting_group_id: zigbee_control_group
      sorting_weight: 40
    on_press:
      - switch.turn_on: zRST_gpio
      - delay: 15ms
      - switch.turn_off: zRST_gpio
      - lambda: 'id(zigbee_efr32).restore_runtime_baud();'
      - if:
          condition:
            lambda: 'return id(manual_bootloader_active);'
          then:
            - if:
                condition:
                  lambda: 'return !id(bootloader_was_paused);'
                then:
                  - stream_server.resume: { id: '${older_efr32_stream}' }
            - lambda: 'id(manual_bootloader_active) = false;'

  - platform: template
    name: "Pause Stream"
    id: pause_stream
    web_server:
      sorting_group_id: zigbee_control_group
      sorting_weight: 20
    on_press:
      - stream_server.pause: { id: ss }

  - platform: template
    name: "Resume Stream"
    id: resume_stream
    web_server:
      sorting_group_id: zigbee_control_group
      sorting_weight: 30
    on_press:
      - stream_server.resume: { id: ss }

uart:
  id: uart_bus
  rx_pin: GPIO17
  tx_pin: GPIO5
  baud_rate: 115200

stream_server:
  id: ss
  uart_id: uart_bus
  port: 6638 # optional, default is 6638

binary_sensor:
  - platform: stream_server
    connected:
      name: "Serial Connection Status"
      device_class: connectivity
      icon: mdi:serial-port
      web_server:
        sorting_group_id: zigbee_info_group
        sorting_weight: 5

mdns:
  services:
    - service: "_tubeszb"
      protocol: "_tcp"
      port: 6638
      txt:
        version: "1.0"
        name: "TubesZB"
        radio_type: "ezsp"
        baud_rate: "115200"
        data_flow_control: "software"
    - service: "_zigbee-coordinator"
      protocol: "_tcp"
      port: 6638
      txt:
        version: 1
        name: "TubesZB"
        radio_type: "ezsp"
        serial_number: !lambda 'return esphome::get_mac_address();'

text_sensor:
  - platform: template
    name: "TubesZB ESPHome FW Version"
    id: project_version
    entity_category: "diagnostic"
    icon: mdi:information-box
    update_interval: 24h
    web_server:
      sorting_group_id: info_group
      sorting_weight: 10
    lambda: |-
      return { ESPHOME_PROJECT_VERSION };

  - platform: ethernet_info
    ip_address:
      name: ESP IP Address
      icon: mdi:ip-network-outline
      web_server:
        sorting_group_id: info_group
        sorting_weight: 20
    mac_address:
      name: ESP MAC Address
      icon: mdi:network-outline
      web_server:
        sorting_group_id: info_group
        sorting_weight: 30

  - platform: template
    name: "Documentation"
    update_interval: 24h
    icon: mdi:file-document-outline
    lambda: 'return {"https://tubeszb.com/documentation"};'
    entity_category: "diagnostic"
    web_server:
      sorting_group_id: info_group
      sorting_weight: 40

  - platform: uptime
    name: Uptime
    format:
      separator: " "
      days: "D"
    web_server:
      sorting_group_id: info_group
      sorting_weight: 50

tubeszb_web:
  model: "TubesZB MGM210 Series 2"

# Physical boot output remains available on this standalone board.
efr32_flasher:
  boot_switch: zBSL
